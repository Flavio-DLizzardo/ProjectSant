 ---
 # Playbook de operações de Day 2 para PostgreSQL
 # Este playbook assume que:
 # - O serviço do PostgreSQL é gerenciado por systemd (ex.: nome de serviço "postgresql" ou "postgresql-15").
 # - As credenciais de administração (ex.: usuário "postgres") já estão configuradas de forma segura (ex.: .pgpass ou vars criptografadas).
 # - Os hosts de banco estão definidos em um grupo de inventário (ex.: [postgresql]).
 #
 # Ajuste os nomes de serviço, caminhos de backup e parâmetros conforme o ambiente real.

 - name: Operações de Day 2 - PostgreSQL
   hosts: postgresql
   become: true
   vars:
     postgres_service_name: "postgresql"
     postgres_user: "postgres"
     postgres_backup_dir: "/var/backups/postgresql"
     postgres_backup_filename: "backup_full_{{ ansible_date_time.date }}_{{ ansible_date_time.time }}.sql"
     postgres_db_name: "pedidos_db"
     postgres_restore_file: "/var/backups/postgresql/arquivo_para_restore.sql"

   tasks:
     - name: Verificar se diretório de backup existe
       file:
         path: "{{ postgres_backup_dir }}"
         state: directory
         owner: "{{ postgres_user }}"
         group: "{{ postgres_user }}"
         mode: "0750"

     - name: Verificar status do serviço PostgreSQL
       ansible.builtin.service_facts:

     - name: Exibir status atual do serviço PostgreSQL
       debug:
         msg: >
           Serviço {{ postgres_service_name }} está
           {{ (services[postgres_service_name].state is defined) | ternary(services[postgres_service_name].state, 'desconhecido') }}
           e habilitado =
           {{ (services[postgres_service_name].status is defined and 'enabled' in services[postgres_service_name].status) | ternary('sim', 'não') }}
       when: services[postgres_service_name] is defined

     - name: Iniciar serviço PostgreSQL (se parado)
       ansible.builtin.service:
         name: "{{ postgres_service_name }}"
         state: started
         enabled: true

     - name: Gerar backup lógico completo da base de dados
       become_user: "{{ postgres_user }}"
       ansible.builtin.command: >
         pg_dump -Fc -d {{ postgres_db_name }} -f {{ postgres_backup_dir }}/{{ postgres_backup_filename }}
       register: backup_result
       changed_when: backup_result.rc == 0

     - name: Exibir caminho do backup gerado
       debug:
         msg: "Backup gerado em {{ postgres_backup_dir }}/{{ postgres_backup_filename }}"

     - name: Validar se arquivo de restore existe (quando for executar restore)
       ansible.builtin.stat:
         path: "{{ postgres_restore_file }}"
       register: restore_file_stat

     - name: Restaurar base de dados a partir de backup (opcional)
       become_user: "{{ postgres_user }}"
       ansible.builtin.command: >
         pg_restore -d {{ postgres_db_name }} {{ postgres_restore_file }}
       when: restore_file_stat.stat.exists | default(false)
       register: restore_result
       changed_when: restore_result.rc == 0

     - name: Testar conexão simples ao banco de dados
       become_user: "{{ postgres_user }}"
       ansible.builtin.command: >
         psql -d {{ postgres_db_name }} -c "SELECT 1;"
       register: connectivity_test
       changed_when: false

     - name: Exibir resultado do teste de conectividade
       debug:
         var: connectivity_test.stdout_lines

     - name: Reiniciar serviço PostgreSQL (sob demanda)
       ansible.builtin.service:
         name: "{{ postgres_service_name }}"
         state: restarted
       when: false  # altere para "true" ou use --tags para controlar quando reiniciar

